services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PlatformBridge!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PlatformBridge!2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - sql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/core/PlatformBridge.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Persistence__Provider: SqlServer
      ConnectionStrings__PlatformBridge: Server=sqlserver,1433;Database=PlatformBridge;User Id=sa;Password=PlatformBridge!2026;TrustServerCertificate=True
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./src/web
    ports:
      - "3000:80"
    depends_on:
      - api

  commerce-adapter:
    build:
      context: ./services/commerce-adapter
    environment:
      CORE_API_URL: http://api:8080/api/events
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - api

  donation-adapter:
    build:
      context: ./services/donation-adapter
    environment:
      CORE_API_URL: http://api:8080/api/events
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - api

volumes:
  sql-data:
